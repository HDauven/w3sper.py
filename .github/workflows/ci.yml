name: Python SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Install wheel and test outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/w3sper-wheel"
          "$RUNNER_TEMP/w3sper-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/w3sper-wheel/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          "$RUNNER_TEMP/w3sper-wheel/bin/python" -I "$GITHUB_WORKSPACE/examples/offline.py"
